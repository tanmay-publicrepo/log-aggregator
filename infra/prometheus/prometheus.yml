global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: kafka
    static_configs: [{ targets: ["kafka:7071"] }]
  - job_name: connect
    static_configs: [{ targets: ["connect:7072"] }]
  - job_name: postgres-sink
    static_configs: [{ targets: ["connect:7075"] }]
  - job_name: shipper
    static_configs: [{ targets: ["shipper:7073"] }]
  - job_name: processor
    static_configs: [{ targets: ["processor:7074"] }]
  - job_name: kafka-exporter
    static_configs: [{ targets: ["kafka-exporter:9308"] }]